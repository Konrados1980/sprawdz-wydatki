<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krok 1 – wczytanie wyciągu CSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f0; --surface: #ffffff; --ink: #1c2b3a; --muted: #5b6b78;
  --line: #d3dcd8; --accent: #1f6f6b; --ok: #1e7a46; --bad: #b3261e; --minus: #8a3b12;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121a20; --surface: #1a252d; --ink: #e3ebe8; --muted: #9aabb5;
    --line: #2c3a43; --accent: #5cc0b8; --ok: #6fd39a; --bad: #ff8a80; --minus: #f0a070;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121a20; --surface: #1a252d; --ink: #e3ebe8; --muted: #9aabb5;
  --line: #2c3a43; --accent: #5cc0b8; --ok: #6fd39a; --bad: #ff8a80; --minus: #f0a070;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
main { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 .25rem; }
p.lead { color: var(--muted); margin: 0 0 1.5rem; max-width: 60ch; }
.drop {
  display: block; border: 2px dashed var(--line); border-radius: 10px;
  background: var(--surface); padding: 1.5rem; text-align: center; cursor: pointer;
}
.drop:hover, .drop:focus-within { border-color: var(--accent); }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.drop strong { color: var(--accent); }
#error { color: var(--bad); margin-top: 1rem; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); margin: 1.5rem 0; }
.stat { background: var(--surface); padding: .8rem 1rem; }
.stat span { display: block; color: var(--muted); font-size: .85rem; }
.stat b { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.check { padding: .9rem 1rem; border-left: 4px solid var(--ok); background: var(--surface); margin-bottom: 1.5rem; }
.check.bad { border-color: var(--bad); }
.table-wrap { overflow-x: auto; max-height: 60vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: .45rem .7rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 500; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.neg { color: var(--minus); }
.tag { font-size: .75rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 .3rem; margin-left: .4rem; }
tr.err td { background: color-mix(in srgb, var(--bad) 15%, transparent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Krok 1: wczytanie wyciągu</h1>
  <p class="lead">Wybierz plik CSV z historią konta. Strona sprawdzi, czy dobrze go odczytała: kodowanie, średniki, kwoty i ciągłość sald.</p>

  <label class="drop">
    <input type="file" id="file" accept=".csv,text/csv">
    <strong>Wybierz plik CSV</strong> albo upuść go tutaj
  </label>
  <p style="margin:.75rem 0 0"><button type="button" id="sampleBtn" style="font:inherit;font-size:.9rem;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:6px;padding:.35rem .75rem;cursor:pointer">Wczytaj przykładowe dane (fikcyjne)</button></p>
  <div id="error" role="alert"></div>

  <section id="result" hidden>
    <div class="stats" id="stats"></div>
    <div class="check" id="check"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Opis operacji</th><th>Kwota</th><th>Saldo po operacji</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
// 1) Parser CSV: separator wykrywany z nagłówka (średnik z banku albo przecinek
//    po zapisaniu w Excelu/Arkuszach), cudzysłowy chronią separator wewnątrz pola.
function detectDelimiter(text) {
  const header = text.split(/\r?\n/, 1)[0];
  return (header.match(/;/g) || []).length >= (header.match(/,/g) || []).length ? ";" : ",";
}
function parseCSV(text, sep) {
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === sep) { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// 2) Kwoty liczymy w groszach (liczby całkowite), żeby uniknąć błędów typu 0,1 + 0,2.
function toGrosze(s) {
  const m = s.replace(/[\s\u00a0]/g, "").match(/^(-?)(\d+),(\d{2})PLN$/);
  if (!m) throw new Error(`Nie rozumiem kwoty: "${s}"`);
  const v = Number(m[2]) * 100 + Number(m[3]);
  return m[1] ? -v : v;
}
function fmt(gr) {
  const sign = gr < 0 ? "-" : "";
  const zl = Math.floor(Math.abs(gr) / 100).toLocaleString("pl-PL");
  return `${sign}${zl},${String(Math.abs(gr) % 100).padStart(2, "0")} PLN`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let fileInfo = "";
function handle(file) {
  const errBox = document.getElementById("error");
  errBox.textContent = ""; document.getElementById("result").hidden = true;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      // 3) Kodowanie: najpierw próbujemy UTF-8 w trybie ścisłym (tak zapisują Excel/Arkusze).
      //    Jeśli bajty nie są poprawnym UTF-8, to plik prosto z banku, czyli Windows-1250.
      let text, encoding;
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(reader.result); encoding = "UTF-8"; }
      catch { text = new TextDecoder("windows-1250").decode(reader.result); encoding = "Windows-1250"; }
      text = text.replace(/^﻿/, "");               // usuwamy ewentualny znacznik BOM
      const sep = detectDelimiter(text);
      const all = parseCSV(text, sep).filter(r => r.some(f => f.trim() !== ""));
      if (!all.length || all[0][0].trim() !== "#Data operacji")
        throw new Error("To nie wygląda na wyciąg: pierwszy wiersz powinien zaczynać się od „#Data operacji”.");
      fileInfo = `${encoding}, separator „${sep}”`;
      const ops = all.slice(1).map((r, i) => {
        if (r.length < 6) throw new Error(`Wiersz ${i + 2} ma za mało pól (${r.length}).`);
        return { date: r[0], desc: r[1], amount: toGrosze(r[4]), balance: toGrosze(r[5]) };
      });
      show(ops, file.name);
    } catch (e) { errBox.textContent = e.message; }
  };
  reader.onerror = () => { errBox.textContent = "Nie udało się odczytać pliku."; };
  reader.readAsArrayBuffer(file);
}

function show(ops, name) {
  // 4) Kontrola sald: idziemy od najstarszej operacji (koniec listy) do najnowszej.
  const oldest = ops[ops.length - 1];
  const start = oldest.balance - oldest.amount;
  let bal = start; const bad = new Set();
  for (let i = ops.length - 1; i >= 0; i--) {
    bal += ops[i].amount;
    if (bal !== ops[i].balance) { bad.add(i); bal = ops[i].balance; }
  }
  const inflow = ops.filter(o => o.amount > 0).reduce((s, o) => s + o.amount, 0);
  const outflow = ops.filter(o => o.amount < 0).reduce((s, o) => s + o.amount, 0);

  document.getElementById("stats").innerHTML = [
    ["Plik", esc(name)],
    ["Format", esc(fileInfo)],
    ["Liczba operacji", ops.length],
    ["Okres", `${oldest.date} – ${ops[0].date}`],
    ["Saldo początkowe", fmt(start)],
    ["Saldo końcowe", fmt(ops[0].balance)],
    ["Wszystkie wpływy", fmt(inflow)],
    ["Wszystkie obciążenia", fmt(outflow)],
  ].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");

  const check = document.getElementById("check");
  check.className = "check" + (bad.size ? " bad" : "");
  check.textContent = bad.size
    ? `Uwaga: ${bad.size} wierszy ma saldo niezgodne z poprzednim saldem i kwotą (podświetlone w tabeli).`
    : `Salda się zgadzają: każde saldo = poprzednie saldo + kwota operacji (${ops.length} z ${ops.length}).`;

  document.getElementById("rows").innerHTML = ops.map((o, i) => `
    <tr class="${bad.has(i) ? "err" : ""}">
      <td>${o.date}</td>
      <td>${esc(o.desc)}${o.desc.includes(";") ? '<span class="tag">opis ze średnikiem</span>' : ""}</td>
      <td class="num ${o.amount < 0 ? "neg" : ""}">${fmt(o.amount)}</td>
      <td class="num">${fmt(o.balance)}</td>
    </tr>`).join("");
  document.getElementById("result").hidden = false;
}

const input = document.getElementById("file");
input.addEventListener("change", () => input.files[0] && handle(input.files[0]));
const drop = document.querySelector(".drop");
drop.addEventListener("dragover", e => e.preventDefault());
drop.addEventListener("drop", e => { e.preventDefault(); e.dataTransfer.files[0] && handle(e.dataTransfer.files[0]); });
// Na GitHub Pages: przycisk wczytuje fikcyjny wyciąg z folderu dane/.
document.getElementById("sampleBtn").addEventListener("click", async () => {
  try {
    const res = await fetch("../dane/FIKCYJNE_historia_konta_2026-07_do_2026-09.csv");
    if (!res.ok) throw new Error();
    handle(new File([await res.arrayBuffer()], "FIKCYJNE_historia_konta_2026-07_do_2026-09.csv"));
  } catch {
    document.getElementById("error").textContent = "Nie udało się pobrać przykładowych danych. Wybierz plik CSV ręcznie.";
  }
});
</script>
</body>
</html>
